<!-- Three Sixty Health website: global styles.
     Paste ALL of this into the funnel/website step's Settings > Tracking Code > Header Code.
     Every block depends on it. Styles are scoped under .tsh so they won't clash with GHL. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
.tsh{
  --moss:#4A5D45;--moss-deep:#3B4A37;--butter:#FFF6BF;--lilac:#E6C8F2;
  --linen:#F7F1E8;--euc:#C5D1BC;--terra:#D9774A;--terra-dark:#C2623A;
  --line-dark:rgba(247,241,232,.18);--line-light:rgba(74,93,69,.16);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.65;
  color:var(--moss);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.tsh *,.tsh *::before,.tsh *::after{box-sizing:border-box;margin:0;padding:0}
.tsh img{max-width:100%;display:block}
.tsh a{color:inherit}

/* Layout */
.tsh-sec{padding:128px 0;position:relative;overflow:hidden}
.tsh-sec.tsh-tight{padding:88px 0}
.tsh-wrap{max-width:1168px;margin:0 auto;padding:0 24px}
.tsh-narrow{max-width:760px;margin-left:auto;margin-right:auto}
.tsh-center{text-align:center}
.tsh-center .tsh-lede{margin-left:auto;margin-right:auto}

/* Backgrounds: one dominant background per section */
.tsh-moss{background:var(--moss);color:var(--butter)}
.tsh-linen{background:var(--linen);color:var(--moss)}
.tsh-euc{background:var(--euc);color:var(--moss)}

/* Type */
.tsh-eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:300;letter-spacing:.26em;text-transform:uppercase;margin-bottom:24px}
.tsh-eyebrow::before{content:"";width:28px;height:2px;background:var(--lilac);border-radius:2px}
.tsh-linen .tsh-eyebrow::before,.tsh-euc .tsh-eyebrow::before{background:var(--terra)}
.tsh h1,.tsh h2,.tsh h3,.tsh h4{font-weight:700;letter-spacing:-.035em;line-height:1}
.tsh h1{font-size:clamp(42px,6.2vw,76px);line-height:.94;letter-spacing:-.045em}
.tsh h2{font-size:clamp(34px,4.6vw,56px);line-height:.98;margin-bottom:24px}
.tsh h3{font-size:22px;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
.tsh h1 em,.tsh h2 em{font-style:italic;font-weight:300;letter-spacing:-.02em}
.tsh-moss h1 em,.tsh-moss h2 em{color:var(--lilac)}
.tsh-linen h1 em,.tsh-linen h2 em,.tsh-euc h2 em{color:var(--terra)}
.tsh-lede{font-size:clamp(18px,1.6vw,21px);font-style:italic;font-weight:300;line-height:1.55;max-width:620px;opacity:.95}
.tsh p+p{margin-top:16px}
.tsh strong{font-weight:600}

/* Buttons */
.tsh-btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px;align-items:center}
.tsh-center .tsh-btns{justify-content:center}
.tsh-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:18px 30px;border-radius:999px;background:var(--terra);color:var(--linen)!important;font-size:15px;font-weight:600;letter-spacing:.02em;text-decoration:none;border:2px solid var(--terra);transition:transform .2s ease,background .2s ease,box-shadow .2s ease;box-shadow:0 10px 28px -12px rgba(217,119,74,.7)}
.tsh-btn:hover{background:var(--terra-dark);border-color:var(--terra-dark);transform:translateY(-2px)}
.tsh-btn .tsh-arrow{transition:transform .2s ease}
.tsh-btn:hover .tsh-arrow{transform:translateX(4px)}
.tsh-btn-ghost{background:transparent;box-shadow:none;border-color:currentColor}
.tsh-moss .tsh-btn-ghost{color:var(--butter)!important}
.tsh-linen .tsh-btn-ghost,.tsh-euc .tsh-btn-ghost{color:var(--moss)!important}
.tsh-btn-ghost:hover{background:rgba(255,255,255,.08);border-color:currentColor}
.tsh-microcopy{font-size:13px;font-weight:300;letter-spacing:.02em;opacity:.8;margin-top:14px}

/* Pills / ticks */
.tsh-pills{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:40px;font-size:14px;font-weight:400}
.tsh-pills span{display:inline-flex;align-items:center;gap:8px}
.tsh-tick{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--lilac);color:var(--moss);font-size:11px;font-weight:700}
.tsh-linen .tsh-tick,.tsh-euc .tsh-tick{background:var(--moss);color:var(--butter)}

/* Cards and grids */
.tsh-grid{display:grid;gap:20px}
.tsh-g2{grid-template-columns:repeat(2,1fr)}
.tsh-g3{grid-template-columns:repeat(3,1fr)}
.tsh-g4{grid-template-columns:repeat(4,1fr)}
.tsh-card{border-radius:22px;padding:34px 30px;background:#fff;border:1px solid var(--line-light)}
.tsh-moss .tsh-card{background:rgba(247,241,232,.06);border-color:var(--line-dark)}
.tsh-card-euc{background:var(--euc)!important;border-color:transparent!important}
.tsh-card-moss{background:var(--moss)!important;color:var(--butter);border-color:transparent!important}
.tsh-card p{font-size:16px;opacity:.9}
.tsh-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--linen);color:var(--moss);margin-bottom:22px}
.tsh-moss .tsh-icon{background:var(--lilac)}
.tsh-icon svg{width:24px;height:24px}
.tsh-num{font-size:13px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-bottom:18px;display:block}
.tsh-head{margin-bottom:56px}
.tsh-rule{height:1px;background:var(--line-light);border:0;margin:56px 0}
.tsh-moss .tsh-rule{background:var(--line-dark)}

/* Quote */
.tsh-quote{font-size:clamp(22px,2.6vw,30px);font-style:italic;font-weight:300;line-height:1.3;letter-spacing:-.01em}

/* Placeholder tags: search class="tbc" and replace before publishing */
.tsh .tbc{display:inline-block;background:#FFE66B;color:#3B3000;font-style:normal;font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1.3;padding:3px 8px;border-radius:6px;vertical-align:middle}

/* Reveal on scroll (progressive: content is visible without JS) */
.tsh-js .tsh-reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
.tsh-js .tsh-reveal.tsh-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.tsh-js .tsh-reveal{opacity:1;transform:none;transition:none}.tsh-btn{transition:none}}

/* Responsive */
@media (max-width:980px){
  .tsh-g4{grid-template-columns:repeat(2,1fr)}
  .tsh-g3{grid-template-columns:1fr}
}
@media (max-width:767px){
  .tsh{font-size:16px}
  .tsh-sec{padding:84px 0}
  .tsh-sec.tsh-tight{padding:64px 0}
  .tsh-wrap{padding:0 20px}
  .tsh-g2,.tsh-g4{grid-template-columns:1fr}
  .tsh-head{margin-bottom:40px}
  .tsh-card{padding:28px 24px}
  .tsh-btn{width:100%}
  .tsh-btns{margin-top:28px}
}
</style>
<script>
(function(){
  document.documentElement.classList.add('tsh-js');
  function run(){
    var els=document.querySelectorAll('.tsh-reveal');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('tsh-in')});return}
    var io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('tsh-in');io.unobserve(en.target)}})},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(e){io.observe(e)});
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run)}else{run()}
  // GHL builds some sections after load; catch late ones.
  setTimeout(run,1200);setTimeout(run,3500);
})();
</script>
